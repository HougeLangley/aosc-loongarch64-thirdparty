[Service]
# Current gsgpu exposes WINDOW-only EGL configs. Do not rewrite WINDOW to
# PBUFFER: that produces zero Qt configs and a null EGLConfig/surface.
Environment=LD_PRELOAD=
Environment=QSG_RHI_BACKEND=opengl
Environment=QT_QPA_PLATFORM=wayland
Environment=__EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/40_gsgpu.json
Environment=GBM_BACKEND=gsgpu
ExecStart=
ExecStart=/usr/libexec/plasma-loonggpu/plasmashell
